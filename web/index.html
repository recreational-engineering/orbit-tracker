<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orbit Tracker Webapp</title>
  <meta name="theme-color" content="#0a0a0a">
  <link rel="stylesheet" href="style.css">
  <!-- Fetched by app.js once it runs; start the downloads with the HTML instead. -->
  <link rel="preload" href="vendor/land-50m.json" as="fetch" crossorigin>
  <link rel="preload" href="vendor/countries-110m.json" as="fetch" crossorigin>
  <link rel="preload" href="vendor/terrain-2048.jpg" as="image">
  <link rel="preload" href="vendor/barlow-condensed-600.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preconnect" href="https://celestrak.org" crossorigin>
  <script src="vendor/d3-array.min.js" defer></script>
  <script src="vendor/d3-geo.min.js" defer></script>
  <script src="vendor/topojson-client.min.js" defer></script>
  <script src="vendor/satellite.min.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main class="app">
    <aside class="side" id="side">
      <header class="bar">
        <h1>ORBIT TRACKER WEBAPP</h1>
        <button type="button" class="params-toggle" id="paramsToggle" aria-expanded="false" aria-controls="params">Params</button>
      </header>

      <div class="params" id="params">
        <section class="sect">
          <h2>Target</h2>
          <div class="prop">
            <label for="norad">norad_id</label>
            <span class="ctl row">
              <input id="norad" type="number" value="100614" min="1">
              <button id="load" class="btn">Load</button>
            </span>
          </div>
          <div id="status" class="status">Loading…</div>
        </section>

        <section class="sect">
          <h2>Parameters</h2>
          <div class="prop stack">
            <label for="time">time_offset <output id="timeOut">now</output></label>
            <input id="time" type="range" min="-720" max="720" step="1" value="0">
          </div>
          <div class="prop stack">
            <label for="exag">alt_exaggeration <output id="exagOut">1.0×</output></label>
            <input id="exag" type="range" min="1" max="5" step="0.1" value="1">
          </div>
        </section>

        <section class="sect">
          <h2>Layers</h2>
          <label class="prop switch"><span>graticule</span><input type="checkbox" id="graticule" checked></label>
          <label class="prop switch"><span>borders</span><input type="checkbox" id="borders" checked></label>
          <label class="prop switch"><span>reticle</span><input type="checkbox" id="reticle" checked></label>
          <label class="prop switch"><span>night_side</span><input type="checkbox" id="night" checked></label>
        </section>

        <!-- Written by app.js; not shown. -->
        <dl id="readout" hidden></dl>
      </div>
    </aside>

    <section class="stage">
      <!-- Emulated round 4" display. The canvas is the exact pixel buffer the ESP32 would render;
           CSS scales it to the largest circle that fits the stage. -->
      <canvas id="display" width="720" height="720"></canvas>
    </section>
  </main>

  <script>
    // Compact layout: the parameter strip folds away above the screen.
    (() => {
      const btn = document.getElementById('paramsToggle');
      const side = document.getElementById('side');
      btn.addEventListener('click', () => {
        const open = side.classList.toggle('open');
        btn.setAttribute('aria-expanded', String(open));
      });
    })();
  </script>
  <script>
    // Offline cache and instant reloads on the static site; not on the local dev server.
    if ('serviceWorker' in navigator && !/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)) {
      addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
